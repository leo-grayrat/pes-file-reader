<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PES2021 存档浏览器（只读）</title>
<style>
  :root{--bg:#0e1320;--panel:#161d2e;--panel2:#1d2740;--line:#2a3550;
    --txt:#e6ecf5;--dim:#8b97b0;--accent:#4da3ff;--accent2:#ffcb47;
    --good:#3fbf6f;--mid:#f4b740;--low:#e2603f;--gk:#9b6bff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:13px}
  .app{display:flex;height:100vh}
  nav{width:200px;flex:0 0 200px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:10px 0}
  nav h1{font-size:13px;color:var(--accent);padding:4px 14px 12px;margin:0;line-height:1.4}
  nav .sub{font-size:10px;color:var(--dim);padding:0 14px 12px}
  nav button{flex:0 0 auto;background:none;border:none;color:var(--dim);text-align:left;
    padding:9px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent}
  nav button:hover{background:var(--panel2);color:var(--txt)}
  nav button.on{background:var(--panel2);color:var(--accent);border-left-color:var(--accent);font-weight:600}
  nav .ft{margin-top:auto;font-size:10px;color:var(--dim);padding:10px 14px;border-top:1px solid var(--line)}
  main{flex:1;min-width:0;overflow:auto;padding:16px 20px}
  .secttl{font-size:15px;color:var(--txt);margin:0 0 4px}
  .secnote{color:var(--dim);font-size:11px;margin-bottom:12px}
  .ovcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:8px 0}
  .ovcell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .ovcell .n{font-size:22px;font-weight:700;color:var(--accent2)}
  .ovcell .l{color:var(--dim);font-size:11px;margin-top:2px}
  .unsolved{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
  .unsolved li{color:var(--dim);margin:4px 0;font-size:12px}
  /* filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{color:var(--dim);font-size:11px}
  select,input[type=text],input[type=number]{background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px}
  input[type=text]:focus,select:focus{outline:1px solid var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;max-height:120px;overflow:auto;padding:4px;
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;min-width:220px}
  .chip{padding:3px 7px;border-radius:12px;background:#243152;color:var(--dim);cursor:pointer;
    font-size:11px;border:1px solid transparent;user-select:none}
  .chip.on{background:var(--accent);color:#06101f;font-weight:600}
  .mode{font-size:11px;color:var(--dim)}
  .mode b{color:var(--accent2);cursor:pointer}
  .clearbtn{background:#2a3550;color:var(--txt);border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;cursor:pointer;font-size:12px}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--bg);cursor:pointer;user-select:none}
  tbody tr:hover{background:var(--panel2)}
  .pos{display:inline-block;min-width:30px;text-align:center;padding:1px 5px;border-radius:4px;
    background:#243152;color:var(--txt);font-weight:600;font-size:11px}
  .pos.GK{background:var(--gk);color:#0e1320}
  .ov{font-weight:700;color:var(--accent2)}
  .badge{display:inline-block;padding:0 5px;border-radius:3px;font-size:10px;margin-right:3px}
  .bA{background:var(--good);color:#06101f}.bB{background:var(--mid);color:#06101f}.bC{background:#3a4767;color:var(--txt)}
  .n{color:var(--accent2);font-weight:600;font-size:12px}
  .resn{color:var(--dim);font-size:11px;margin:6px 0}
  /* detail modal */
  .mask{position:fixed;inset:0;background:rgba(4,8,16,.72);display:none;align-items:flex-start;
    justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
  .mask.show{display:flex}
  .card{width:680px;max-width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:18px 20px}
  .card h2{margin:0 0 2px;font-size:19px}
  .card .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  .close{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:10px 0}
  .kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
  .kv span:first-child{color:var(--dim)}
  .bars{margin-top:10px}
  .bar{display:flex;align-items:center;gap:8px;margin:4px 0}
  .bar .nm{width:84px;color:var(--dim);font-size:11px;flex:0 0 84px}
  .bar .track{flex:1;height:12px;background:#223;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .bar .v{width:26px;text-align:right;font-weight:600;font-size:11px}
  .secttl2{margin:14px 0 4px;color:var(--accent);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--line);padding-top:10px}
  .tag{display:inline-block;background:#243152;color:var(--txt);padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;font-size:11px}
  .tag.gk{background:var(--gk);color:#0e1320}
  .playpos{display:flex;flex-wrap:wrap;gap:5px}
  .pp{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px}
  .foot{color:var(--dim);font-size:11px;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
  .loading{color:var(--dim);padding:20px}
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>PES2021<br>存档浏览器</h1>
    <div class="sub">外置 · 独立 · 只读</div>
    <button data-s="overview" class="on">概览</button>
    <button data-s="players">球员（能力值+隐藏）</button>
    <button data-s="edit_teams">EDIT 球队</button>
    <button data-s="ml_teams">大师联赛球队</button>
    <button data-s="events">动态事件表</button>
    <button data-s="schedules">赛程表</button>
    <button data-s="competitions">赛事定义表</button>
    <button data-s="ml_squads">大师联赛阵容</button>
    <button data-s="ml_links">队际链接网络</button>
    <div class="ft">数据来自 decoded/ + outputs/*.csv<br>不写回存档</div>
  </nav>
  <main id="main"><div class="loading">加载中…</div></main>
</div>
<div class="mask" id="mask"><div class="card" id="card"></div></div>

<script>
const CACHE={};
const $=(s,r=document)=>r.querySelector(s);
const main=$('#main');
const navBtns=[...document.querySelectorAll('nav button')];
navBtns.forEach(b=>b.onclick=()=>{
  navBtns.forEach(x=>x.classList.remove('on'));b.classList.add('on');
  show(b.dataset.s);
});
function euro(v){return '€'+(+v).toLocaleString('en-US');}

/* 页面每次加载生成唯一版本串：让 API URL 与任何历史缓存条目都不同，
   彻底绕开浏览器/预览面板的 HTTP 缓存（曾导致旧版 players 数组缺 p[16]，总评显示 —）。 */
const BOOT = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function getJSON(url){
  if(CACHE[url])return CACHE[url];
  const u = url + (url.includes('?') ? '&' : '?') + '_v=' + BOOT;
  const r = await fetch(u, {cache:'no-store'});
  const j = await r.json();
  CACHE[url] = j;
  return j;
}

/* ---------- 概览 ---------- */
async function showOverview(){
  const o=await getJSON('/api/overview');
  let h=`<div class="secttl">存档结构总览</div><div class="secnote">数据源：${o.source}｜本工具只读展示，不写回。</div>`;
  h+=`<div class="ovgrid">`+Object.entries(o.counts).map(([k,v])=>
    `<div class="ovcell"><div class="n">${v.toLocaleString()}</div><div class="l">${k}</div></div>`).join('')+`</div>`;
  h+=`<div class="unsolved"><div style="color:var(--accent);font-size:12px;margin-bottom:6px">尚未闭合 / 待逆向</div><ul>`+
    o.unsolved.map(x=>`<li>${x}</li>`).join('')+`</ul></div>`;
  main.innerHTML=h;
}

/* ---------- 通用表格 ---------- */
async function showTable(sec, cols, note){
  const rows=await getJSON('/api/'+sec);
  const key=sec;
  function render(q){
    q=(q||'').toLowerCase();
    const f=rows.filter(r=>cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)));
    let h=`<div class="secttl">${TITLE[sec]}</div><div class="secnote">${note}</div>`;
    h+=`<div class="filters"><div class="fld"><label>搜索（全部列）</label><input type="text" id="q_${key}" value="${q}" placeholder="输入关键字…"></div></div>`;
    h+=`<div class="resn">命中 ${f.length.toLocaleString()} / ${rows.length.toLocaleString()} 条（渲染前 500）</div>`;
    h+=`<table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>`;
    const top=f.slice(0,500);
    for(const r of top){
      h+='<tr>'+cols.map(c=>`<td>${fmtCell(c,r[c.k])}</td>`).join('')+'</tr>';
    }
    h+='</tbody></table>';
    main.innerHTML=h;
    const inp=$('#q_'+key);inp.oninput=()=>render(inp.value);
  }
  render('');
}
function fmtCell(c,v){
  if(v===null||v===undefined||v==='')return '<span style="color:var(--dim)">—</span>';
  if(c.fmt==='eur')return euro(v);
  return String(v);
}

const TITLE={edit_teams:'EDIT 球队（已命名）',ml_teams:'大师联赛球队块（700）',
  events:'动态事件表（已命名）',schedules:'赛程表（ML0）',competitions:'赛事定义表',
  ml_squads:'大师联赛阵容（队 → 球员）',ml_links:'队际链接网络（596B 记录）'};
const COLS={
  edit_teams:[{k:'team_id',label:'球队ID'},{k:'team_name',label:'队名'},{k:'confidence',label:'置信度'},{k:'n_players',label:'球员数'}],
  ml_teams:[{k:'ml_idx',label:'序号'},{k:'name_cn',label:'中文队名'},{k:'abbr',label:'缩写'},{k:'stadium',label:'球场'},{k:'budget_eur',label:'预算',fmt:'eur'},{k:'ml_seq',label:'ML序号'}],
  events:[{k:'idx',label:'事件#'},{k:'date',label:'日期'},{k:'v1_status',label:'状态'},{k:'v3_money_x100',label:'金额(×100)',fmt:'eur'},{k:'name',label:'主体'},{k:'any_name',label:'关联名'},{k:'v4_name',label:'v4名'},{k:'v5_name',label:'v5名'},{k:'v6_name',label:'v6名'}],
  schedules:[{k:'seq',label:'seq'},{k:'year',label:'年'},{k:'month',label:'月'},{k:'day',label:'日'},{k:'round',label:'轮次'}],
  competitions:[{k:'idx',label:'#'},{k:'name',label:'赛事名'},{k:'comp_id',label:'赛事ID'},{k:'type',label:'类型'},{k:'season_year',label:'起始年'},{k:'operable',label:'可操作'}],
  ml_links:[{k:'rec_idx',label:'记录#'},{k:'h3_team',label:'源队'},{k:'h4_team',label:'目标队'},{k:'h4',label:'目标队ID'},{k:'count',label:'count'},{k:'n_entries',label:'条目数'},{k:'edit_id_links',label:'EDIT引用'},{k:'sample_entries',label:'样例(球员:类型:值)'}],
};

/* ---------- 球员（修复渲染 bug） ---------- */
let PLAY=null;
async function showPlayers(){
  const D=await getJSON('/api/players');PLAY={data:D.players,meta:D.meta};
  const M=PLAY.meta;
  let h=`<div class="secttl">球员检索 / 筛选（EDIT 能力值 + 隐藏机制）</div>`;
  h+=`<div class="secnote">${M.count.toLocaleString()} 名球员｜双击打开的 player_browser.html 是同一数据的离线版（已修复渲染）。</div>`;
  /* 自诊断：若数据列数不足（旧缓存/旧后端），明确报出而不是静默显示 — */
  if(PLAY.data.length && PLAY.data[0].length < 17){
    h+=`<div class="secnote" style="color:#e06c6c">⚠ 检测到 /api/players 返回 ${PLAY.data[0].length} 列（应为 17 列，缺总评字段）。`+
       `多半是取到了旧缓存或旧后端进程，请硬刷新（Ctrl+Shift+R）或重启服务。</div>`;
    console.warn('[pes-ui] players 记录列数异常:', PLAY.data[0].length, '应为 17');
  }
  h+=`<div class="filters">
    <div class="fld"><label>姓名</label><input type="text" id="fName" placeholder="如 梅西"></div>
    <div class="fld"><label>注册位置</label><select id="fPos"></select></div>
    <div class="fld"><label>比赛风格</label><select id="fStyle"></select></div>
    <div class="fld"><label>惯用脚</label><select id="fFoot"><option value="-1">全部</option><option value="0">右脚</option><option value="1">左脚</option></select></div>
    <div class="fld"><label>指定能力值</label><select id="fAbil"></select></div>
    <div class="fld"><label>最低</label><input type="number" id="fMin" min="40" max="99" value="40"></div>
    <div class="fld"><label>最高</label><input type="number" id="fMax" min="40" max="99" value="99"></div>
    <div class="fld"><label>逆足使用≥</label><input type="number" id="fWfu" min="1" max="4" value="1"></div>
    <div class="fld"><label>逆足精度≥</label><input type="number" id="fWfa" min="1" max="4" value="1"></div>
    <div class="fld"><label>抗伤≥</label><input type="number" id="fIr" min="1" max="3" value="1"></div>
    <div class="fld"><label>状态≥</label><input type="number" id="fCond" min="1" max="8" value="1"></div>
    <div class="fld"><label>排序</label><select id="sortBy"></select></div>
  </div>`;
  h+=`<div class="fld" style="width:100%"><label>技能筛选 <span class="mode">匹配：<b id="skMode">任一</b></span></label><div class="chips" id="skChips"></div></div>`;
  h+=`<div class="fld" style="width:100%"><label>COM 风格 <span class="mode">匹配：<b id="comMode">任一</b></span></label><div class="chips" id="comChips"></div></div>`;
  h+=`<div style="margin:8px 0"><button class="clearbtn" id="clearBtn">清空条件</button></div>`;
  h+=`<div class="resn" id="resN"></div><table><thead><tr><th>姓名</th><th>位置</th><th>风格</th><th>年龄</th><th>总评</th><th>前3能力</th></tr></thead><tbody id="tbody"></tbody></table>`;
  main.innerHTML=h;
  // 用 innerHTML 填充下拉（保留 id，避免此前 replaceWith 丢 id 导致渲染崩溃）
  $('#fPos').innerHTML='<option value="-1">全部</option>'+M.positions.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  $('#fStyle').innerHTML='<option value="-1">全部</option>'+M.playStyles.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  $('#fAbil').innerHTML='<option value="-1">不限制</option>'+M.abilities.map((n,i)=>`<option value="${i}">${M.abilityLabels[i]}</option>`).join('');
  $('#sortBy').innerHTML='<option value="ov">总评(高→低)</option><option value="name">姓名</option>'+
    M.abilities.map((n,i)=>`<option value="a${i}">${M.abilityLabels[i]}(高→低)</option>`).join('')+
    '<option value="ageD">年龄(高→低)</option>';
  $('#skChips').innerHTML=M.skills.map((n,i)=>`<span class="chip" data-i="${i}">${n}</span>`).join('');
  $('#comChips').innerHTML=M.comStyles.map((n,i)=>`<span class="chip" data-i="${i}">${n}</span>`).join('');
  const sel={sk:new Set(),com:new Set()};let skMode='any',comMode='any';
  $('#skChips').onclick=e=>{if(e.target.dataset.i!=null){const i=+e.target.dataset.i;sel.sk.has(i)?sel.sk.delete(i):sel.sk.add(i);e.target.classList.toggle('on');runP();}};
  $('#comChips').onclick=e=>{if(e.target.dataset.i!=null){const i=+e.target.dataset.i;sel.com.has(i)?sel.com.delete(i):sel.com.add(i);e.target.classList.toggle('on');runP();}};
  $('#skMode').onclick=()=>{skMode=skMode==='any'?'all':'any';$('#skMode').textContent=skMode==='any'?'任一':'全部';runP();};
  $('#comMode').onclick=()=>{comMode=comMode==='any'?'all':'any';$('#comMode').textContent=comMode==='any'?'任一':'全部';runP();};
  ['fName','fPos','fStyle','fFoot','fAbil','fMin','fMax','fWfu','fWfa','fIr','fCond','sortBy']
    .forEach(id=>{const el=$('#'+id);el.oninput=runP;el.onchange=runP;});
  $('#clearBtn').onclick=()=>{$('#fName').value='';$('#fPos').value='-1';$('#fStyle').value='-1';$('#fFoot').value='-1';
    $('#fAbil').value='-1';$('#fMin').value=40;$('#fMax').value=99;$('#fWfu').value=1;$('#fWfa').value=1;$('#fIr').value=1;$('#fCond').value=1;
    sel.sk.clear();sel.com.clear();skMode='any';comMode='any';$('#skMode').textContent='任一';$('#comMode').textContent='任一';
    document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));runP();};
  function ov(p){const v=p&&p[16];return (typeof v==='number')?v:'—';}  /* 总评：后端按注册位置非负加权×熟练度乘子估算 */
  function filt(){
    const name=$('#fName').value.trim().toLowerCase();
    const pos=+$('#fPos').value,sty=+$('#fStyle').value,foot=+$('#fFoot').value;
    const abi=+$('#fAbil').value,mn=+$('#fMin').value,mx=+$('#fMax').value;
    const wfu=+$('#fWfu').value,wfa=+$('#fWfa').value,ir=+$('#fIr').value,cond=+$('#fCond').value;
    const out=[];
    for(const p of PLAY.data){
      if(name&&!p[1].toLowerCase().includes(name))continue;
      if(pos>=0&&p[4]!==pos)continue;
      if(sty>=0&&p[5]!==sty)continue;
      if(foot>=0&&p[6]!==foot)continue;
      if(abi>=0){const v=p[15][abi];if(v<mn||v>mx)continue;}
      if(p[7]<wfu||p[8]<wfa||p[9]<ir||p[10]<cond)continue;
      if(sel.sk.size){const hs=p[14];const ok=skMode==='all'?([...sel.sk].every(i=>hs.includes(i))):([...sel.sk].some(i=>hs.includes(i)));if(!ok)continue;}
      if(sel.com.size){const hc=p[13];const ok=comMode==='all'?([...sel.com].every(i=>hc.includes(i))):([...sel.com].some(i=>hc.includes(i)));if(!ok)continue;}
      out.push(p);
    }
    return out;
  }
  function sortLst(a){const k=$('#sortBy').value;
    if(k==='name')a.sort((x,y)=>x[1].localeCompare(y[1],'zh'));
    else if(k==='ageD')a.sort((x,y)=>y[3]-x[3]);
    else if(k==='ov')a.sort((x,y)=>ov(y)-ov(x));
    else if(k.startsWith('a')){const i=+k.slice(1);a.sort((x,y)=>y[15][i]-x[15][i]);}
    return a;}
  function runP(){
    const a=sortLst(filt());
    $('#resN').textContent='命中 '+a.length.toLocaleString()+' / '+M.count.toLocaleString()+' 人（渲染前 300）';
    const tb=$('#tbody');tb.innerHTML='';
    for(const p of a.slice(0,300)){
      const tr=document.createElement('tr');tr.onclick=()=>openDetail(p);
      const t3=[...p[15]].map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).slice(0,3);
      tr.innerHTML=`<td>${p[1]}</td><td><span class="pos ${M.positions[p[4]]}">${M.positions[p[4]]}</span></td>`+
        `<td>${M.playStyles[p[5]]}</td><td>${p[3]}</td><td class="ov">${ov(p)}</td>`+
        `<td>${t3.map(([v,i])=>`<span class="badge bA">${M.abilityLabels[i]} ${v}</span>`).join('')}</td>`;
      tb.appendChild(tr);
    }
  }
  function gb(g){return g===2?'<span class="bA">A</span>':g===1?'<span class="bB">B</span>':'<span class="bC">C</span>';}
  function openDetail(p){
    const o=ov(p);let pp='';
    for(let i=0;i<13;i++){const g=+p[12][i];pp+=`<span class="pp">${M.playableOrder[i]} ${gb(g)}</span>`;}
    const sk=p[14].map(i=>`<span class="tag">${M.skills[i]}</span>`).join('')||'<span style="color:var(--dim)">无</span>';
    const com=p[13].map(i=>`<span class="tag gk">${M.comStyles[i]}</span>`).join('')||'<span style="color:var(--dim)">无</span>';
    const bars=M.abilities.map((n,i)=>{const v=p[15][i];const c=v>=85?'var(--good)':v>=75?'var(--accent)':v>=60?'var(--mid)':'var(--low)';
      const pct=Math.max(0,(v-40)/59*100).toFixed(1);
      return `<div class="bar"><div class="nm">${M.abilityLabels[i]}</div><div class="track"><div class="fill" style="width:${pct}%;background:${c}"></div></div><div class="v">${v}</div></div>`;}).join('');
    $('#card').innerHTML=`<span class="close" onclick="closeD()">✕</span><h2>${p[1]}</h2>`+
      `<div class="sub">pid ${p[0]} · 国籍码 ${p[2]} · 总评 ${o} · 球星评级 ${p[11]}</div>`+
      `<div class="grid">`+kvp('注册位置',M.positions[p[4]])+kvp('比赛风格',M.playStyles[p[5]])+
      kvp('年龄',p[3])+kvp('惯用脚',p[6]?'左脚':'右脚')+kvp('逆足使用',p[7]+' / 4')+kvp('逆足精度',p[8]+' / 4')+
      kvp('抗伤',p[9]+' / 3')+kvp('状态',p[10]+' / 8')+`</div>`+
      `<div class="secttl2">可踢位置（全位置默认 C，少数升 B/A）</div><div class="playpos">${pp}</div>`+
      `<div class="secttl2">能力值（25 项）</div><div class="bars">${bars}</div>`+
      `<div class="secttl2">球员技能 (${p[14].length})</div>${sk}`+
      `<div class="secttl2">COM 比赛风格 (${p[13].length})</div>${com}`+
      `<div class="foot">数据来自 EDIT 存档解码（implyingrigged.info 字段表）。本工具 read-only，不写回存档。<br>`+
      `<span style="color:var(--dim)">${M.overallNote||''}</span></div>`;
    $('#mask').classList.add('show');
  }
  window.closeD=()=>$('#mask').classList.remove('show');
  $('#mask').onclick=e=>{if(e.target.id==='mask')closeD();};
  runP();
}
/* ---------- 大师联赛阵容（队 → 球员） ---------- */
async function showSquads(){
  const D=await getJSON('/api/ml_squads');
  const teams=D.teams.slice().sort((a,b)=>a.ml_idx-b.ml_idx);
  const byIdx={};teams.forEach(t=>byIdx[t.ml_idx]=t);
  let h=`<div class="secttl">大师联赛阵容（队 → 球员）</div>`;
  h+=`<div class="secnote">${teams.length} 支球队的注册球员（team→player 映射 @+0xA0 stride 8）。`+
     `姓名 join EDIT 库（${D.player_name_hits.toLocaleString()} 人命中）；未注册的默认库球员仅显示 ID。</div>`;
  h+=`<div class="filters"><div class="fld"><label>选择球队</label><select id="sqTeam"></select></div>`+
     `<div class="fld"><label>队内搜索</label><input type="text" id="sqQ" placeholder="姓名或 pid…"></div></div>`;
  h+=`<div class="resn" id="sqN"></div>`;
  h+=`<table><thead><tr><th>序号</th><th>球员ID</th><th>姓名</th></tr></thead><tbody id="sqBody"></tbody></table>`;
  main.innerHTML=h;
  $('#sqTeam').innerHTML=teams.map(t=>`<option value="${t.ml_idx}">${t.ml_idx} · ${t.name}</option>`).join('');
  function render(){
    const ti=+$('#sqTeam').value;
    const t=byIdx[ti]||teams[0];
    const q=$('#sqQ').value.trim().toLowerCase();
    const ps=t.players.filter(p=>!q||(p.name&&p.name.toLowerCase().includes(q))||String(p.pid).includes(q));
    $('#sqN').textContent=`${t.name}：共 ${t.players.length} 人，命中 ${ps.length}`;
    const tb=$('#sqBody');tb.innerHTML='';
    for(const p of ps){
      const name=p.name?p.name:`<span style="color:var(--dim)">未知 (pid ${p.pid})</span>`;
      tb.innerHTML+=`<tr><td>${p.idx}</td><td>${p.pid}</td><td>${name}</td></tr>`;
    }
  }
  $('#sqTeam').onchange=render;
  $('#sqQ').oninput=render;
  render();
}
function kvp(k,v){return `<div class="kv"><span>${k}</span><span>${v}</span></div>`;}

/* ---------- 路由 ---------- */
async function show(s){
  main.innerHTML='<div class="loading">加载中…</div>';
  try{
    if(s==='overview')await showOverview();
    else if(s==='players')await showPlayers();
    else if(s==='ml_squads')await showSquads();
    else await showTable(s, COLS[s], NOTE[s]);
  }catch(e){main.innerHTML='<div class="loading">加载失败：'+e+'</div>';}
}
const NOTE={
  edit_teams:'EDIT 球队与球员数（team_id_names_final.csv 命名）。',
  ml_teams:'大师联赛 700 队块：中文队名 / 缩写 / 球场 / 预算(×100欧) / ML 序号。',
  events:'动态事件表（route-A 命名 122/297），v3 为金额(×100)。',
  schedules:'大师联赛赛程（ML0，逐条 seq/日期/轮次）。',
  competitions:'赛事定义表（直接解 ML 数据块 0x1F1E30，stride 0x314）。',
  ml_squads:'大师联赛 700 队块内的阵容（team→player 映射 @+0xA0 stride 8），球员姓名 join EDIT 库；默认库球员仅显示 ID。',
  ml_links:'ML 文件级队际球员监控/关系网络（596B e5 07 记录：h3=源队注册id, h4=目标队注册id, entry=16B[球员][0][类型][值]）。属隐藏机制一类，非状态/合约/成长/训练。',
};
show('overview');
