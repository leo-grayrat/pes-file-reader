<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PES2021 存档浏览器（只读）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · genre: atmospheric · macrostructure: Workbench · theme: lumen · drop: night
   source: C:\Users\34788\.agents\skills\hallmark · redesigned: ui/index.html · scope: single-page visual layer
   pre-emit critique: P4 H4 E4 S4 R4 V5
   contrast: pass (40–41) · nav: N10 vertical rail · footer: Ft1 status strip · slop: pass (42–45)
   honest: pass (46) · chrome: pass (47) · tokens: pass (48) · responsive: pass (34,49,50–57) · icons: pass (30)
   knob deltas: first Hallmark run for this project (no prior .hallmark/log.json entry) — apparatus = filament
   chamber, never a glowing orb; mono register scoped to eyebrows / labels / table-heads / status only;
   meter strip is decorative signal, not a metric; every figure on the page is a live /api/overview value. */
:root{
  --color-paper:      oklch(13% 0.014 265);
  --color-paper-2:    oklch(16% 0.016 265);
  --color-ink:        oklch(96% 0.006 262);
  --color-dim:        oklch(72% 0.010 262);
  --color-accent:     oklch(76% 0.17 50);    /* molten brass */
  --color-accent-ink: oklch(15% 0.03 50);    /* text on brass fill */
  --color-accent-2:   oklch(68% 0.16 18);    /* coral chord — drawn underline + landmark */
  --color-glow:       oklch(80% 0.16 50 / 0.42);
  --color-paper-emit: oklch(76% 0.17 50 / 0.04);
  --rule-blueprint:   oklch(96% 0.006 262 / 0.04);
  --rule:             oklch(96% 0.006 262 / 0.10);
  --rule-strong:      oklch(96% 0.006 262 / 0.18);
  --color-good:       oklch(72% 0.14 150);   --color-good-ink: oklch(16% 0.05 150);
  --color-mid:        oklch(78% 0.13 85);    --color-mid-ink:  oklch(22% 0.06 85);
  --color-low:        oklch(64% 0.17 25);
  --color-gk:         oklch(70% 0.14 295);   --color-gk-ink:    oklch(16% 0.05 295);
  --color-scrim:      oklch(8% 0.01 265 / 0.74);
  --brass-1:          oklch(82% 0.16 50);    /* apparatus gradient stops */
  --brass-2:          oklch(76% 0.17 50);
  --brass-3:          oklch(66% 0.16 50);
  --font-display:     "Instrument Serif", ui-serif, Georgia, serif;
  --font-body:        "Geist", ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
  --font-label:       "JetBrains Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;height:100vh;overflow:hidden;color:var(--color-ink);
  font-family:var(--font-body);font-size:13px;line-height:1.55;
  background-color:var(--color-paper);
  background-image:
    linear-gradient(var(--rule-blueprint) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule-blueprint) 1px, transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;height:100vh}

/* ---------- nav rail (N10: vertical instrument rail) ---------- */
nav{width:216px;flex:0 0 216px;background:var(--color-paper-2);
  border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:16px 0}
nav .brand{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.16em;
  font-size:10px;color:var(--color-accent);padding:0 16px 4px}
nav .brand b{display:block;font-family:var(--font-display);font-size:24px;letter-spacing:0;
  text-transform:none;color:var(--color-ink);font-weight:400;line-height:1.2}
nav .sub{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.14em;
  font-size:9px;color:var(--color-dim);padding:0 16px 16px}
nav button{flex:0 0 auto;background:none;border:none;color:var(--color-dim);text-align:left;
  padding:8px 16px;cursor:pointer;font-size:13px;font-family:var(--font-body);
  display:flex;align-items:center;gap:8px;border-left:2px solid transparent;
  white-space:nowrap;line-height:1}
nav button .ni{font-family:var(--font-label);font-size:10px;color:var(--color-dim);line-height:1}
nav button:hover{background:var(--color-paper);color:var(--color-ink)}
nav button:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
nav button:active{background:var(--color-paper);color:var(--color-ink)}
nav button.on{background:var(--color-paper);color:var(--color-ink);border-left-color:var(--color-accent);
  box-shadow:inset 0 0 24px var(--color-paper-emit)}
nav button.on .ni{color:var(--color-accent)}
nav .ft{margin-top:auto;font-family:var(--font-label);text-transform:uppercase;letter-spacing:.08em;
  font-size:9px;color:var(--color-dim);padding:12px 16px 0;border-top:1px solid var(--rule);line-height:1.8}

/* ---------- main ---------- */
main{flex:1;min-width:0;overflow:auto;padding:24px 28px 64px}
.eyebrow{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.18em;
  font-size:11px;color:var(--color-accent);margin-bottom:8px}
.secttl{font-size:18px;font-weight:600;color:var(--color-ink);margin:0 0 4px;
  overflow-wrap:anywhere;min-width:0}
.secnote{color:var(--color-dim);font-size:11px;margin-bottom:12px}

/* ---------- overview hero (Workbench: apparatus + instrument readouts) ---------- */
.hero{display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;align-items:center;
  margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.hero-app{display:flex;justify-content:center}
.apparatus{width:100%;max-width:248px;height:auto}
.apparatus .chamber{fill:none;stroke:var(--rule-strong);stroke-width:1}
.apparatus .chamber-in{fill:none;stroke:var(--rule);stroke-width:1}
.apparatus .rod{fill:url(#brass);filter:drop-shadow(0 0 7px var(--color-glow));
  animation:breathe 4s ease-out infinite}
.apparatus .el{stroke:var(--rule-strong);stroke-width:1}
.apparatus .lead{stroke:var(--rule);stroke-width:1}
.apparatus .node{fill:var(--color-accent)}
.apparatus .gs-top{stop-color:var(--brass-1)}
.apparatus .gs-mid{stop-color:var(--brass-2)}
.apparatus .gs-bot{stop-color:var(--brass-3)}
.apparatus .cap-l{fill:var(--color-dim);font-family:var(--font-label);font-size:8px;
  letter-spacing:.12em;text-transform:uppercase}
.apparatus .cap-v{fill:var(--color-accent);font-family:var(--font-display);font-size:18px}
@keyframes breathe{0%,100%{opacity:.8}50%{opacity:1}}
.display{font-size:32px;line-height:1.25;color:var(--color-ink);margin:4px 0 8px;font-weight:500;
  overflow-wrap:anywhere;min-width:0}
.display .land{font-family:var(--font-display);color:var(--color-accent-2);font-weight:400;font-style:normal}
.display .ul{position:relative;white-space:nowrap}
.display .ul::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-3px;height:5px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20200%205'%20preserveAspectRatio='none'%3E%3Cpath%20d='M1%203%20C40%201%2080%204%20120%201.5%20S180%204%20199%202'%20stroke='%23cf6a4c'%20stroke-width='2'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E") no-repeat;
  background-size:100% 100%}
.lede{color:var(--color-dim);font-size:13px;max-width:46ch;margin:0 0 16px}
.stats{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.stat{display:flex;flex-direction:column;line-height:1}
.stat-v{font-family:var(--font-display);font-size:32px;line-height:1;color:var(--color-accent);
  font-variant-numeric:tabular-nums}
.stat-l{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.12em;
  font-size:9px;color:var(--color-dim);margin-top:4px;line-height:1}
.meter{display:flex;align-items:flex-end;gap:4px;height:32px;margin-top:16px;
  border-bottom:1px solid var(--rule);overflow:hidden}
.meter i{width:4px;background:linear-gradient(var(--color-accent),transparent);
  opacity:.45;border-radius:1px}

/* ---------- overview grid ---------- */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px;margin:8px 0 4px}
.ovcell{background:var(--color-paper-2);border:1px solid var(--rule);border-radius:8px;
  padding:12px 16px;box-shadow:inset 0 0 24px var(--color-paper-emit)}
.ovcell .n{font-size:24px;font-weight:700;color:var(--color-accent);font-variant-numeric:tabular-nums;line-height:1.2}
.ovcell .l{color:var(--color-dim);font-size:11px;margin-top:4px}
.unsolved{background:var(--color-paper-2);border:1px solid var(--rule);border-radius:8px;
  padding:12px 16px;margin-top:12px;box-shadow:inset 0 0 24px var(--color-paper-emit)}
.unsolved .uh{color:var(--color-accent);font-family:var(--font-label);text-transform:uppercase;
  letter-spacing:.12em;font-size:11px;margin-bottom:8px}
.unsolved li{color:var(--color-dim);margin:4px 0;font-size:12px;list-style:none}
.unsolved ul{margin:0;padding:0}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{color:var(--color-dim);font-size:10px;font-family:var(--font-label);
  text-transform:uppercase;letter-spacing:.08em;line-height:1}
select,input[type=text],input[type=number]{background:var(--color-paper-2);color:var(--color-ink);
  border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:12px;
  font-family:var(--font-body);min-height:32px;line-height:1;
  outline:2px solid transparent;outline-offset:1px}
select:hover,input[type=text]:hover,input[type=number]:hover{border-color:var(--rule-strong)}
select:focus-visible,input[type=text]:focus-visible,input[type=number]:focus-visible{
  outline-color:var(--color-accent);border-color:var(--color-accent)}
select:active,input[type=text]:active,input[type=number]:active{border-color:var(--color-accent)}
select:disabled,input[type=text]:disabled,input[type=number]:disabled{
  opacity:.55;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow:auto;padding:8px;
  background:var(--color-paper-2);border:1px solid var(--rule);border-radius:8px;min-width:220px}
.chip{padding:4px 8px;border-radius:12px;background:var(--color-paper);color:var(--color-dim);
  cursor:pointer;font-size:11px;border:1px solid var(--rule);user-select:none;font-family:var(--font-body);
  white-space:nowrap;line-height:1}
.chip:hover{border-color:var(--rule-strong);color:var(--color-ink)}
.chip:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.chip:active{border-color:var(--color-accent)}
.chip.on{background:var(--color-accent);color:var(--color-accent-ink);font-weight:600;border-color:var(--color-accent)}
.mode{font-size:11px;color:var(--color-dim)}
.mode b{color:var(--color-accent-2);cursor:pointer;font-weight:600}
.clearbtn{background:var(--color-paper-2);color:var(--color-ink);border:1px solid var(--rule);
  border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-family:var(--font-body);
  min-height:32px;line-height:1;white-space:nowrap}
.clearbtn:hover{border-color:var(--color-accent);color:var(--color-accent)}
.clearbtn:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.clearbtn:active{background:var(--color-paper);color:var(--color-accent)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{color:var(--color-dim);font-weight:600;position:sticky;top:0;background:var(--color-paper);
  cursor:pointer;user-select:none;font-family:var(--font-label);text-transform:uppercase;
  letter-spacing:.05em;font-size:10px}
tbody tr:hover{background:var(--color-paper-2)}
.pos{display:inline-block;min-width:32px;text-align:center;padding:0 4px;border-radius:4px;
  background:var(--color-paper);color:var(--color-ink);font-weight:600;font-size:11px;line-height:1.4}
.pos.GK{background:var(--color-gk);color:var(--color-gk-ink)}
.ov{font-weight:700;color:var(--color-accent);font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:0 4px;border-radius:4px;font-size:10px;margin-right:4px;line-height:1.4}
.bA{background:var(--color-good);color:var(--color-good-ink)}
.bB{background:var(--color-mid);color:var(--color-mid-ink)}
.bC{background:var(--color-paper);color:var(--color-dim)}
.n{color:var(--color-accent);font-weight:600;font-size:12px}
.resn{color:var(--color-dim);font-size:11px;margin:8px 0}

/* ---------- detail modal ---------- */
.mask{position:fixed;inset:0;background:var(--color-scrim);display:none;align-items:flex-start;
  justify-content:center;padding:32px 16px;overflow:auto;z-index:50}
.mask.show{display:flex}
.card{width:680px;max-width:100%;background:var(--color-paper-2);border:1px solid var(--rule-strong);
  border-radius:12px;padding:20px 24px;box-shadow:inset 0 0 40px var(--color-paper-emit)}
.card h2{margin:0 0 4px;font-size:24px;font-weight:600;font-family:var(--font-body);line-height:1.25}
.card .sub{color:var(--color-dim);font-size:12px;margin-bottom:16px}
.close{float:right;cursor:pointer;color:var(--color-dim);font-size:20px;line-height:1;font-family:var(--font-body)}
.close:hover{color:var(--color-accent)}
.close:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.close:active{color:var(--color-accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 24px;margin:12px 0}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--rule);padding:4px 0}
.kv span:first-child{color:var(--color-dim);font-size:12px}
.kv span:last-child{color:var(--color-ink);font-size:12px}
.bars{margin-top:12px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar .nm{width:84px;color:var(--color-dim);font-size:11px;flex:0 0 84px}
.bar .track{flex:1;min-width:0;height:12px;background:var(--color-paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;border-radius:8px}
.bar .v{width:28px;text-align:right;font-weight:600;font-size:11px;color:var(--color-ink);
  font-variant-numeric:tabular-nums}
.secttl2{margin:16px 0 4px;color:var(--color-accent);font-size:11px;font-weight:600;
  font-family:var(--font-label);text-transform:uppercase;letter-spacing:.1em;
  border-top:1px solid var(--rule);padding-top:12px}
.tag{display:inline-block;background:var(--color-paper);color:var(--color-ink);padding:4px 8px;
  border-radius:4px;margin:4px 4px 4px 0;font-size:11px;white-space:nowrap;line-height:1.2}
.tag.gk{background:var(--color-gk);color:var(--color-gk-ink)}
.playpos{display:flex;flex-wrap:wrap;gap:4px}
.pp{display:flex;align-items:center;gap:4px;background:var(--color-paper);border:1px solid var(--rule);
  border-radius:4px;padding:4px 8px;font-size:11px;line-height:1}
.foot{color:var(--color-dim);font-size:11px;margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.loading{color:var(--color-dim);padding:24px}

/* ---------- 筛选台（球员检索）：分组仪器台，不是平铺控件堆 ---------- */
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;
  margin-bottom:12px;padding:16px;background:var(--color-paper-2);
  border:1px solid var(--rule);border-radius:8px;box-shadow:inset 0 0 24px var(--color-paper-emit)}
.bench-grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.bench-grp .eb{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.14em;
  font-size:9px;color:var(--color-accent);line-height:1}
.bench-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bench2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:8px}
.afrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0 4px}
.af{display:inline-flex;align-items:center;gap:4px;background:var(--color-paper-2);
  border:1px solid var(--rule);border-radius:12px;padding:4px 8px;font-size:11px;
  color:var(--color-ink);cursor:pointer;line-height:1;white-space:nowrap}
.af:hover{border-color:var(--color-accent-2);color:var(--color-accent-2)}
.af:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.af:active{border-color:var(--color-accent-2)}
.af .x{color:var(--color-dim);font-size:12px;line-height:1}
.afnone{font-size:11px;color:var(--color-dim);font-family:var(--font-label);letter-spacing:.05em}

/* 迷你仪表：总评 / 隐藏机制 / 预算 共用 */
.mm{display:inline-flex;align-items:center;gap:8px}
.mm .mt{width:48px;height:5px;background:var(--color-paper);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.mm .mf{height:100%;background:var(--color-accent);border-radius:4px}
.mm .mv{font-family:var(--font-label);font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--color-ink);min-width:20px;text-align:right;line-height:1}
.mbar{display:inline-flex;align-items:center;gap:8px}
.mbar .t{width:56px;height:5px;background:var(--color-paper);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.mbar .f{height:100%;background:var(--color-accent);border-radius:4px}

/* 表格：数值列 / 空状态 / 命中高亮 / 状态标记 */
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:32px 16px;text-align:center;color:var(--color-dim);font-family:var(--font-label);
  font-size:11px;letter-spacing:.05em;border:1px dashed var(--rule);border-radius:8px;margin-top:8px}
mark{background:var(--color-paper-emit);color:var(--color-accent);border-radius:2px;padding:0 1px}
.dash{color:var(--color-dim)}
.flag{display:inline-block;padding:0 4px;border-radius:4px;font-family:var(--font-label);
  font-size:10px;line-height:1.4}
.flag.yes{background:var(--color-good);color:var(--color-good-ink)}
.flag.no{background:var(--color-paper);color:var(--color-dim)}

/* ---------- 球员详情：头部仪表 / 隐藏机制 / 阵型图 / 能力分组 ---------- */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:4px;flex-wrap:wrap}
.phead .sub{margin-bottom:0}
.ovbox{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;line-height:1}
.ovbox .ovn{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--color-accent);
  font-variant-numeric:tabular-nums}
.ovbox .ovl{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.12em;
  font-size:9px;color:var(--color-dim)}
.ovbox .ovt{width:96px;height:5px;background:var(--color-paper);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.ovbox .ovf{height:100%;background:var(--color-accent);border-radius:4px}
.hm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:8px 0}
.hmi{display:flex;flex-direction:column;gap:4px;min-width:0}
.hmi .hl{display:flex;justify-content:space-between;font-size:11px;color:var(--color-dim);line-height:1}
.hmi .hl b{color:var(--color-ink);font-family:var(--font-label);font-size:11px}
.hmi .ht{height:6px;background:var(--color-paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.hmi .hf{height:100%;background:var(--color-accent);border-radius:4px}
/* 位置适性：4 列阵型图，grid-column 由数据内联指定 */
.pmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0;max-width:440px}
.pmap .pc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;
  border:1px solid var(--rule);border-radius:8px;background:var(--color-paper);line-height:1}
.pmap .pc .pn{font-family:var(--font-label);font-size:10px;color:var(--color-dim)}
.pmap .pc .pg{font-family:var(--font-display);font-size:16px;color:var(--color-dim)}
.pmap .pc.A{border-color:var(--color-accent);background:var(--color-paper-emit)}
.pmap .pc.A .pg,.pmap .pc.A .pn{color:var(--color-accent)}
.pmap .pc.B{border-color:var(--rule-strong)}
.pmap .pc.B .pg{color:var(--color-ink)}
.abgrp{margin-bottom:12px}
.abgrp .abt{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.1em;
  font-size:9px;color:var(--color-dim);margin-bottom:4px;line-height:1}

const CACHE={};
const $=(s,r=document)=>r.querySelector(s);

function euro(v){return '€'+(+v).toLocaleString('en-US');}
/* 存档里的队名/人名可能含 & < >，渲染前必须转义，否则脏数据会破版。 */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* 搜索命中高亮：先转义再插 <mark>，避免把关键字本身当标签解析 */
function hlq(s,q){
  const t=String(s);
  if(!q)return esc(t);
  const i=t.toLowerCase().indexOf(q);
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
/* 位置适性阵型图：playableOrder 下标 -> CSS 网格列。
   playableOrder = [GK,CB,LB,RB,DMF,CMF,LM,RM,AMF,RWF,SS,CF,LWF]，13 项全覆盖。 */

  {i:0,c:'2 / 4'},
  {i:2,c:'1 / 2'},{i:1,c:'2 / 3'},{i:3,c:'4 / 5'},
  {i:6,c:'1 / 2'},{i:4,c:'2 / 3'},{i:5,c:'3 / 4'},{i:7,c:'4 / 5'},
  {i:8,c:'2 / 4'},
  {i:12,c:'1 / 2'},{i:10,c:'2 / 3'},{i:11,c:'3 / 4'},{i:9,c:'4 / 5'},
];
/* 25 项能力值按语义分组，ix 为 ABIL_ORDER 下标，合起来覆盖 0–24 全部索引 */
const ABGROUPS=[
  {t:'ATTACK · 进攻',   ix:[0,5,24,21,6]},
  {t:'PASSING · 传球',  ix:[3,4,7]},
  {t:'DRIBBLE · 盘带',  ix:[22,1,2,12]},
  {t:'DEFENCE · 防守',  ix:[19,14,15]},
  {t:'PHYSICAL · 身体', ix:[8,9,10,11,13]},
  {t:'KEEPER · 门将',   ix:[16,17,20,23,18]},

/* 页面每次加载生成唯一版本串：让 API URL 与任何历史缓存条目都不同，
   彻底绕开浏览器/预览面板的 HTTP 缓存（曾导致旧版 players 数组缺 p[16]，总评显示 —）。 */
const BOOT = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function getJSON(url){
  if(CACHE[url])return CACHE[url];
  const u = url + (url.includes('?') ? '&' : '?') + '_v=' + BOOT;
  const r = await fetch(u, {cache:'no-store'});
  const j = await r.json();
  CACHE[url] = j;
  return j;
}

function buildMeter(){
  const m=document.getElementById('meter'); if(!m)return;
  let s='';
  for(let i=0;i<56;i++){
    const ht=8+Math.round(Math.abs(Math.sin(i*0.6))*20);
    s+=`<i style="height:${ht}px"></i>`;
  }
  m.innerHTML=s;
}

/* ---------- 通用表格：数值列右对齐 / 状态标记 / 预算相对条 / 命中高亮 / 空状态 ---------- */
async function showTable(sec, cols, note){
  const rows=await getJSON('/api/'+sec);
  const key=sec;
  /* 预算相对条需要全量最大值；仅 ml_teams 有 budget_eur */
  let budgetMax=0;
  if(sec==='ml_teams')budgetMax=rows.reduce((m,r)=>Math.max(m,parseFloat(r.budget_eur)||0),0);
  function cellHTML(c,r,q){
    const v=r[c.k];
    if(v===null||v===undefined||v==='')return '<span class="dash">—</span>';
    if(c.flag==='status'){            /* events.v1_status: 1=有效, 0=占位 */
      const on=String(v)==='1';
      return `<span class="flag ${on?'yes':'no'}">${on?'有效':'占位'}</span>`;
    }
    if(c.flag==='operable'){          /* competitions.operable: 1=可操作, 0=不可, 其它=未知 */
      const iv=+v;
      if(iv===1)return '<span class="flag yes">可操作</span>';
      if(iv===0)return '<span class="flag no">不可操作</span>';
      return '<span class="flag no">未知</span>';
    }
    if(c.bar==='budget'){
      const num=parseFloat(v)||0;
      const pct=budgetMax?Math.min(100,num/budgetMax*100):0;
      return `<span class="mbar"><span class="t"><span class="f" style="width:${pct.toFixed(1)}%"></span></span>`+
        `<span class="mv">${euro(num)}</span></span>`;
    }
    if(c.fmt==='eur')return euro(v);
    if(c.num)return esc(String(v));
    return hlq(v,q);
  }
  /* 外壳只建一次；输入时只重绘 tbody + 命中数，避免搜索框失焦 / 光标跳位 */
  let h=`<div class="eyebrow">${EYEBROW[sec]}</div><div class="secttl">${TITLE[sec]}</div><div class="secnote">${note}</div>`;
  h+=`<div class="filters"><div class="fld"><label>搜索（全部列）</label><input type="text" id="q_${key}" placeholder="输入关键字…"></div></div>`;
  h+=`<div class="resn" id="resN"></div>`;
  h+=`<table><thead><tr>${cols.map(c=>`<th class="${c.num||c.bar?'num':''}">${c.label}</th>`).join('')}</tr></thead><tbody id="tbody"></tbody></table>`;
  main.innerHTML=h;
  const inp=$('#q_'+key), tb=$('#tbody'), resN=$('#resN');
  function paint(q){
    q=(q||'').toLowerCase();
    const f=rows.filter(r=>cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)));
    resN.textContent='命中 '+f.length.toLocaleString()+' / '+rows.length.toLocaleString()+' 条（渲染前 500）';
    if(!f.length){tb.innerHTML=`<tr><td colspan="${cols.length}"><div class="empty">没有匹配「${esc(q)}」的记录</div></td></tr>`;return;}
    tb.innerHTML=f.slice(0,500).map(r=>'<tr>'+cols.map(c=>`<td class="${c.num||c.bar?'num':''}">${cellHTML(c,r,q)}</td>`).join('')+'</tr>').join('');
  }
  inp.oninput=()=>paint(inp.value);
  paint('');
}

  main.innerHTML=h;

  function filt(){
    const name=$('#fName').value.trim().toLowerCase();
    const pos=+$('#fPos').value,sty=+$('#fStyle').value,foot=+$('#fFoot').value;
    const abi=+$('#fAbil').value,mn=+$('#fMin').value,mx=+$('#fMax').value;
    const wfu=+$('#fWfu').value,wfa=+$('#fWfa').value,ir=+$('#fIr').value,cond=+$('#fCond').value;
    const out=[];
    for(const p of PLAY.data){
      if(name&&!p[1].toLowerCase().includes(name))continue;
      if(pos>=0&&p[4]!==pos)continue;
      if(sty>=0&&p[5]!==sty)continue;
      if(foot>=0&&p[6]!==foot)continue;
      if(abi>=0){const v=p[15][abi];if(v<mn||v>mx)continue;}
      if(p[7]<wfu||p[8]<wfa||p[9]<ir||p[10]<cond)continue;
      if(sel.sk.size){const hs=p[14];const ok=skMode==='all'?([...sel.sk].every(i=>hs.includes(i))):([...sel.sk].some(i=>hs.includes(i)));if(!ok)continue;}
      if(sel.com.size){const hc=p[13];const ok=comMode==='all'?([...sel.com].every(i=>hc.includes(i))):([...sel.com].some(i=>hc.includes(i)));if(!ok)continue;}
      out.push(p);
    }
    return out;
  }
  function sortLst(a){const k=$('#sortBy').value;
    if(k==='name')a.sort((x,y)=>x[1].localeCompare(y[1],'zh'));
    else if(k==='ageD')a.sort((x,y)=>y[3]-x[3]);
    else if(k==='ov')a.sort((x,y)=>ov(y)-ov(x));
    else if(k.startsWith('a')){const i=+k.slice(1);a.sort((x,y)=>y[15][i]-x[15][i]);}
    return a;}
  function runP(){
    const a=sortLst(filt());
    $('#resN').textContent='命中 '+a.length.toLocaleString()+' / '+M.count.toLocaleString()+' 人（渲染前 300）';
    renderAf();
    const tb=$('#tbody');tb.innerHTML='';
    if(!a.length){
      tb.innerHTML='<tr><td colspan="9"><div class="empty">没有球员匹配当前条件 · 点上方生效条件逐条移除</div></td></tr>';
      return;
    }
    for(const p of a.slice(0,300)){
      const tr=document.createElement('tr');tr.onclick=()=>openDetail(p);
      const t3=[...p[15]].map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).slice(0,3);
      const o=ov(p), op=(o==='—')?0:Math.max(0,(o-40)/59*100);
      tr.innerHTML=`<td>${esc(p[1])}</td>`+
        `<td><span class="pos ${M.positions[p[4]]}">${M.positions[p[4]]}</span></td>`+
        `<td>${esc(M.playStyles[p[5]])}</td><td class="num">${p[3]}</td>`+
        `<td><span class="mm"><span class="mt"><span class="mf" style="width:${op.toFixed(1)}%"></span></span>`+
        `<span class="mv">${o}</span></span></td>`+
        `<td class="num">${p[7]}·${p[8]}</td><td class="num">${p[9]}</td><td class="num">${p[10]}</td>`+
        `<td>${t3.map(([v,i])=>`<span class="badge bA">${M.abilityLabels[i]} ${v}</span>`).join('')}</td>`;
      tb.appendChild(tr);
    }
  }
  /* 生效条件回显：把当前筛选状态摊成可逐条移除的 chip。
     原来 12 个控件改完就沉在表单里，用户看不出到底哪些条件在生效。 */
  function conds(){
    const v=id=>$('#'+id).value, out=[];
    if(v('fName').trim())out.push({k:'fName',t:'姓名含 '+v('fName').trim()});
    if(+v('fPos')>=0)out.push({k:'fPos',t:'位置 '+M.positions[+v('fPos')]});
    if(+v('fStyle')>=0)out.push({k:'fStyle',t:'风格 '+M.playStyles[+v('fStyle')]});
    if(+v('fFoot')>=0)out.push({k:'fFoot',t:+v('fFoot')?'左脚':'右脚'});
    if(+v('fAbil')>=0)out.push({k:'fAbil',t:M.abilityLabels[+v('fAbil')]+' '+v('fMin')+'–'+v('fMax')});
    if(+v('fWfu')>1)out.push({k:'fWfu',t:'逆足使用 ≥'+v('fWfu')});
    if(+v('fWfa')>1)out.push({k:'fWfa',t:'逆足精度 ≥'+v('fWfa')});
    if(+v('fIr')>1)out.push({k:'fIr',t:'抗伤 ≥'+v('fIr')});
    if(+v('fCond')>1)out.push({k:'fCond',t:'状态 ≥'+v('fCond')});
    if(sel.sk.size)out.push({k:'__sk',t:'技能('+(skMode==='all'?'全部':'任一')+') '+[...sel.sk].map(i=>M.skills[i]).join('/')});
    if(sel.com.size)out.push({k:'__com',t:'COM('+(comMode==='all'?'全部':'任一')+') '+[...sel.com].map(i=>M.comStyles[i]).join('/')});
    return out;
  }
  function renderAf(){
    const cs=conds(), el=$('#afRow');
    if(!cs.length){el.innerHTML='<span class="afnone">无筛选条件 · 显示全部 '+M.count.toLocaleString()+' 人</span>';return;}
    el.innerHTML='<span class="afnone">生效条件</span>'+
      cs.map(c=>`<span class="af" data-k="${c.k}" tabindex="0">${esc(c.t)}<span class="x">✕</span></span>`).join('')+
      '<span class="af" data-k="__all" tabindex="0">清空全部<span class="x">✕</span></span>';
  }
  function dropCond(k){
    if(k==='__all'){$('#clearBtn').click();return;}
    if(k==='__sk'){sel.sk.clear();document.querySelectorAll('#skChips .chip.on').forEach(c=>c.classList.remove('on'));}
    else if(k==='__com'){sel.com.clear();document.querySelectorAll('#comChips .chip.on').forEach(c=>c.classList.remove('on'));}
    else{const DEF={fName:'',fPos:'-1',fStyle:'-1',fFoot:'-1',fAbil:'-1',fMin:'40',fMax:'99',
      fWfu:'1',fWfa:'1',fIr:'1',fCond:'1'};if(k in DEF)$('#'+k).value=DEF[k];}
    runP();
  }
  $('#afRow').onclick=e=>{const a=e.target.closest('.af');if(a)dropCond(a.dataset.k);};
  $('#afRow').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){
    const a=e.target.closest('.af');if(a){e.preventDefault();dropCond(a.dataset.k);}}};
  function gb(g){return g===2?'<span class="bA">A</span>':g===1?'<span class="bB">B</span>':'<span class="bC">C</span>';}
  function openDetail(p){
    const o=ov(p), op=(o==='—')?0:Math.max(0,(o-40)/59*100);
    /* 位置适性：4 列阵型图 + A/B/C 色编码，比 13 个平铺标签好读得多 */
    const pm=PMAP.map(it=>{const g=+p[12][it.i],gc=g===2?'A':g===1?'B':'C';
      return `<div class="pc ${gc}" style="grid-column:${it.c}">`+
        `<div class="pn">${M.playableOrder[it.i]}</div><div class="pg">${gc}</div></div>`;}).join('');
    /* 隐藏机制：四项都有明确上限，做成 meter 比干数字直观 */
    const hid=[['逆足使用',p[7],4],['逆足精度',p[8],4],['抗伤',p[9],3],['状态',p[10],8]]
      .map(([t,v,mx])=>`<div class="hmi"><div class="hl"><span>${t}</span><b>${v} / ${mx}</b></div>`+
        `<div class="ht"><div class="hf" style="width:${(v/mx*100).toFixed(1)}%"></div></div></div>`).join('');
    /* 25 项能力按语义分组：一条 25 行的平铺列表没人看得下去 */
    const abg=ABGROUPS.map(g=>`<div class="abgrp"><div class="abt">${g.t}</div><div class="abgrid">`+
      g.ix.map(i=>{const v=p[15][i];
        const c=v>=85?'var(--color-good)':v>=75?'var(--color-accent)':v>=60?'var(--color-mid)':'var(--color-low)';
        const pct=Math.max(0,(v-40)/59*100).toFixed(1);
        return `<div class="bar"><div class="nm">${M.abilityLabels[i]}</div>`+
          `<div class="track"><div class="fill" style="width:${pct}%;background:${c}"></div></div>`+
          `<div class="v">${v}</div></div>`;}).join('')+`</div></div>`).join('');
    const sk=p[14].map(i=>`<span class="tag">${M.skills[i]}</span>`).join('')||'<span style="color:var(--color-dim)">无</span>';
    const com=p[13].map(i=>`<span class="tag gk">${M.comStyles[i]}</span>`).join('')||'<span style="color:var(--color-dim)">无</span>';
    $('#card').innerHTML=`<span class="close" onclick="closeD()">✕</span>`+
      `<div class="phead"><div><div class="eyebrow">PID ${p[0]} · 国籍码 ${p[2]}</div>`+
      `<h2>${esc(p[1])}</h2>`+
      `<div class="sub">${M.positions[p[4]]} · ${M.playStyles[p[5]]} · ${p[3]} 岁 · `+
      `${p[6]?'左脚':'右脚'} · 球星评级 ${p[11]}</div></div>`+
      `<div class="ovbox"><div class="ovn">${o}</div><div class="ovl">OVERALL</div>`+
      `<div class="ovt"><div class="ovf" style="width:${op.toFixed(1)}%"></div></div></div></div>`+
      `<div class="secttl2">HIDDEN · 隐藏机制</div><div class="hm">${hid}</div>`+
      `<div class="secttl2">POSITION MAP · 位置适性（默认 C，少数升 B/A）</div><div class="pmap">${pm}</div>`+
      `<div class="secttl2">ABILITIES · 能力值 25 项</div>${abg}`+
      `<div class="secttl2">SKILLS · 球员技能 (${p[14].length})</div>${sk}`+
      `<div class="secttl2">COM STYLES · COM 比赛风格 (${p[13].length})</div>${com}`+
      `<div class="foot">数据来自 EDIT 存档解码（implyingrigged.info 字段表）。本工具 read-only，不写回存档。<br>`+
      `<span style="color:var(--color-dim)">${M.overallNote||''}</span></div>`;
    $('#mask').classList.add('show');
  }
  window.closeD=()=>$('#mask').classList.remove('show');
  $('#mask').onclick=e=>{if(e.target.id==='mask')closeD();};
  runP();
}
/* ---------- 大师联赛阵容（队 → 球员） ---------- */
async function showSquads(){
  const D=await getJSON('/api/ml_squads');
  const teams=D.teams.slice().sort((a,b)=>a.ml_idx-b.ml_idx);
  const byIdx={};teams.forEach(t=>byIdx[t.ml_idx]=t);
  let h=`<div class="eyebrow">${EYEBROW.ml_squads}</div><div class="secttl">大师联赛阵容（队 → 球员）</div>`;
  h+=`<div class="secnote">${teams.length} 支球队的注册球员（team→player 映射 @+0xA0 stride 8）。`+
     `姓名 join EDIT 库（${D.player_name_hits.toLocaleString()} 人命中）；未注册的默认库球员仅显示 ID。</div>`;
  h+=`<div class="filters"><div class="fld"><label>选择球队</label><select id="sqTeam"></select></div>`+
     `<div class="fld"><label>队内搜索</label><input type="text" id="sqQ" placeholder="姓名或 pid…"></div></div>`;
  h+=`<div class="resn" id="sqN"></div>`;
  h+=`<table><thead><tr><th>序号</th><th>球员ID</th><th>姓名</th></tr></thead><tbody id="sqBody"></tbody></table>`;
  main.innerHTML=h;
  $('#sqTeam').innerHTML=teams.map(t=>`<option value="${t.ml_idx}">${t.ml_idx} · ${t.name}</option>`).join('');
  function render(){
    const ti=+$('#sqTeam').value;
    const t=byIdx[ti]||teams[0];
    const q=$('#sqQ').value.trim().toLowerCase();
    const ps=t.players.filter(p=>!q||(p.name&&p.name.toLowerCase().includes(q))||String(p.pid).includes(q));
    $('#sqN').textContent=`${t.name}：共 ${t.players.length} 人，命中 ${ps.length}`;
    const tb=$('#sqBody');tb.innerHTML='';
    for(const p of ps){
      const name=p.name?p.name:`<span style="color:var(--color-dim)">未知 (pid ${p.pid})</span>`;
      tb.innerHTML+=`<tr><td>${p.idx}</td><td>${p.pid}</td><td>${name}</td></tr>`;
    }
  }
  $('#sqTeam').onchange=render;
  $('#sqQ').oninput=render;
  render();
}
function kvp(k,v){return `<div class="kv"><span>${k}</span><span>${v}</span></div>`;}

/* ---------- 路由 ---------- */
async function show(s){
  main.innerHTML='<div class="loading">加载中…</div>';
  try{
    if(s==='overview')await showOverview();
    else if(s==='players')await showPlayers();
    else if(s==='ml_squads')await showSquads();
    else await showTable(s, COLS[s], NOTE[s]);
  }catch(e){main.innerHTML='<div class="loading">加载失败：'+e+'</div>';}
}
const NOTE={
  edit_teams:'EDIT 球队与球员数（team_id_names_final.csv 命名）。',
  ml_teams:'大师联赛 700 队块：中文队名 / 缩写 / 球场 / 预算(×100欧) / ML 序号。',
  events:'动态事件表（route-A 命名 122/297），v3 为金额(×100)。',
  schedules:'大师联赛赛程（ML0，逐条 seq/日期/轮次）。',
  competitions:'赛事定义表（直接解 ML 数据块 0x1F1E30，stride 0x314）。',
  ml_squads:'大师联赛 700 队块内的阵容（team→player 映射 @+0xA0 stride 8），球员姓名 join EDIT 库；默认库球员仅显示 ID。',
  ml_links:'ML 文件级队际球员监控/关系网络（596B e5 07 记录：h3=源队注册id, h4=目标队注册id, entry=16B[球员][0][类型][值]）。属隐藏机制一类，非状态/合约/成长/训练。',
};
show('overview');
</script>
